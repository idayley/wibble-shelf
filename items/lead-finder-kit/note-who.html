<div class="n-head">NOTE · WHAT HAPPENS HERE</div>
<p>When you press <b>Find people</b>, or drop a note here, <b>Lead scout</b> turns it into filters and searches. Searching is <b>free</b>. The people it finds land in <b>Leads</b>.</p>
<p>To change who you want, ask again here. Lead scout only adds people who aren't on the board yet.</p>
