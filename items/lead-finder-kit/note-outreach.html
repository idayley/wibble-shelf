<div class="n-head">NOTE · WHAT HAPPENS HERE</div>
<p>When your picks land here, <b>Outreach asker</b> writes one draft per person for each way you chose to reach them. It uses what Lead scout found about the person and their company.</p>
<p>Drafts go to <b>To send</b>.</p>
