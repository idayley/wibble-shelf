<title>Markets</title>
<!--
  THE MARKETS PAGE. Placed by the Discovery kit in 1 · Markets. A market is
  one bet: who has what pain, shown by what they already do, found where.
  Pressing Find people lands a card in this zone holding the bet and where
  to look, and that landing runs Scout. Nothing here searches or contacts
  anyone.

  Everything it knows lives in the kit store (window.wibble.kit), one key
  per record: market:<id>, settings. The verdict is worked out here from
  the calls, by core.js, and no agent ever writes it.

  The shared rules are in the first script block, pasted from core.js by
  sync-core.mjs. This page's own rules are in the second, with no DOM, so
  pages.test.mjs can run them under node.

  Classes start with dk- on purpose: the frame drops any kit rule whose
  class a page's stylesheet also names.
-->

<body>
<div class="dk-wrap" id="app"></div>

<script id="core">
/* THE DISCOVERY KIT'S SHARED RULES. Every page needs the same count of
   calls, the same verdict and the same "what's next", or the strip, the
   Markets page and the agents drift apart. Pure functions, no DOM, no
   window. This file is the only copy: sync-core.mjs pastes it into each
   page's <script id="core">, and core.test.mjs runs it under node. */

var DAY = 24 * 60 * 60 * 1000;
var LAPSE_DAYS = 14;
var EXTENDED_CALLS = 15;
var DEFAULT_LINE = { calls: 10, hits: 3, commitments: 1 };
var VERDICTS = ["Persevere", "Pivot", "Keep talking"];
var BUYERS = ["budget holder", "decision maker"];

function toMs(t) {
  if (t == null || t === "") return NaN;
  if (typeof t === "number") return t;
  if (t instanceof Date) return t.getTime();
  return Date.parse(t);
}

/* People arrive as a map (id -> person) or a list; either works. */
function peopleIndex(people) {
  if (!people) return {};
  if (Array.isArray(people)) {
    var out = {};
    for (var i = 0; i < people.length; i++) if (people[i] && people[i].id) out[people[i].id] = people[i];
    return out;
  }
  return people;
}

/* The pass line, with the kit's default filling anything left out. The
   store spells it {hits, of, commits}; the older spelling {calls, hits,
   commitments} still reads. */
function lineOf(market) {
  var p = (market && market.passLine) || {};
  function n(v, d) { v = Number(v); return isFinite(v) && v >= 0 ? Math.floor(v) : d; }
  var calls = n(p.of != null ? p.of : p.calls, DEFAULT_LINE.calls) || DEFAULT_LINE.calls;
  return {
    calls: calls,
    hits: n(p.hits, DEFAULT_LINE.hits),
    commitments: n(p.commits != null ? p.commits : p.commitments, DEFAULT_LINE.commitments),
  };
}

function targetOf(market) {
  var line = lineOf(market);
  return market && market.extended ? Math.max(EXTENDED_CALLS, line.calls) : line.calls;
}

function speakerAmbiguous(call) {
  return call.speakerAmbiguous === true || call.speaker === "ambiguous";
}

/* A call that could count, before each person is taken once: in the
   segment, not tainted by a pitch, not a friend or family member, and not
   a low-confidence call where we can't tell who said what. A call with no
   person on the board can't be checked, so it doesn't count. */
function eligible(call, byId) {
  if (!call || !call.person) return false;
  var person = byId[call.person];
  if (call.inSegment === false) return false;
  if (call.tainted) return false;
  if (person && person.relationship === "friend-family") return false;
  if (call.confidence === "low" && speakerAmbiguous(call)) return false;
  return true;
}

function callTime(call) {
  var t = toMs(call.date);
  if (isNaN(t)) t = toMs(call.at);
  return isNaN(t) ? 0 : t;
}

/* A call counts for bet v when it says so, else when it was made under
   that bet. A sharper bet carries over the calls that already described
   its pain; the rest stay with the version they were made under. */
function countsFor(call, v) {
  return call.counts && typeof call.counts[v] === "boolean" ? call.counts[v] : call.betV === v;
}

/* The calls that count toward the pass line: eligible, and each person
   once, their latest call. */
function counted(calls, people) {
  var byId = peopleIndex(people);
  var latest = {};
  var order = [];
  for (var i = 0; i < (calls || []).length; i++) {
    var c = calls[i];
    if (!eligible(c, byId)) continue;
    var prev = latest[c.person];
    if (!prev) { order.push(c.person); latest[c.person] = c; }
    else if (callTime(c) >= callTime(prev)) latest[c.person] = c;
  }
  return order.map(function (p) { return latest[p]; });
}

/* A commitment is live when it was offered or kept and hasn't lapsed. An
   unkept one lapses 14 days after its due date. */
function commitmentLapsed(commitment, now) {
  if (!commitment) return true;
  var s = commitment.status;
  if (s === "fulfilled" || s === "kept") return false;
  if (s === "lapsed" || s === "declined" || s === "withdrawn") return true;
  var due = toMs(commitment.due);
  if (isNaN(due)) return false;
  return due + LAPSE_DAYS * DAY < toMs(now);
}

function orgKey(call, person) {
  var o = (call.org || (person && person.org) || "").trim().toLowerCase();
  return o || null;
}

function marketCalls(market, calls) {
  var id = market && market.id;
  return (calls || []).filter(function (c) { return c && c.market === id; });
}

/* The version of the bet a market is on now. */
function betV(market) {
  var v = market && market.bet && market.bet.v;
  return typeof v === "number" ? v : 1;
}

/* Everything the verdict needs, for one market, from the calls that count
   for its current bet. Commitments come from any eligible call (a
   follow-up call without one doesn't erase an earlier one), one per
   person. Organisations are counted among the hits only. */
function tally(market, calls, people, now) {
  var byId = peopleIndex(people);
  var v = betV(market);
  var mine = marketCalls(market, calls).filter(function (c) { return countsFor(c, v); });
  var cs = counted(mine, byId);
  var line = lineOf(market);
  var ladder = [0, 0, 0, 0, 0, 0];
  var hits = 0, orgs = {}, buyers = 0;
  for (var i = 0; i < cs.length; i++) {
    var c = cs[i], lv = Math.max(0, Math.min(5, Math.round(Number(c.level) || 0)));
    ladder[lv]++;
    if (lv >= 4) {
      hits++;
      var p = byId[c.person];
      var k = orgKey(c, p);
      if (k) orgs[k] = true;
      if (p && BUYERS.indexOf(p.buyingRole) >= 0) buyers++;
    }
  }
  var live = {}, commitments = [];
  for (var j = 0; j < mine.length; j++) {
    var cc = mine[j];
    if (!cc.commitment || !eligible(cc, byId)) continue;
    var lapsed = commitmentLapsed(cc.commitment, now);
    commitments.push({ call: cc.id, person: cc.person, what: cc.commitment.what, currency: cc.commitment.currency, due: cc.commitment.due, status: cc.commitment.status, lapsed: lapsed });
    if (!lapsed) live[cc.person] = true;
  }
  return {
    n: cs.length,
    hits: hits,
    commits: Object.keys(live).length,
    orgs: Object.keys(orgs).length,
    buyers: buyers,
    target: targetOf(market),
    line: line,
    ladder: ladder,
    commitments: commitments,
    notCounted: mine.length - cs.length,
  };
}

/* The pass line may be edited only until the first call is counted. Any
   bet's calls lock it: a sharper bet doesn't reopen the line. */
function lineLocked(market, calls, people) {
  return counted(marketCalls(market, calls), people).length > 0;
}

/* The founder's override wins, and is shown beside the automatic
   verdict, never instead of it. */
function verdict(market, t) {
  var line = t.line || lineOf(market);
  var persevere = t.hits >= line.hits && t.commits >= line.commitments && t.orgs >= 2 && t.buyers >= 1;
  var cantMeet = t.hits + (t.target - t.n) < line.hits;
  var auto = persevere ? "Persevere" : (t.n >= t.target || cantMeet) ? "Pivot" : "Keep talking";
  var closeMiss = auto === "Pivot" && t.hits === line.hits - 1 && t.commits >= 1 && !(market && market.extended);
  var override = market && market.override && VERDICTS.indexOf(market.override.verdict) >= 0 ? market.override : null;
  var out = { auto: auto, closeMiss: closeMiss, shown: override ? override.verdict : auto };
  if (override) out.override = override;
  return out;
}

function plural(n, one, many) { return n + " " + (n === 1 ? one : (many || one + "s")); }

/* What a tab or the verdict line calls the verdict: a market with no
   counted calls hasn't started. */
function verdictLabel(v, t) {
  return t.n === 0 && !v.override ? "Not started" : v.shown;
}

/* The verdict in one sentence, with counts and never a percentage. */
function verdictLine(market, t, v) {
  var line = t.line;
  if (v.shown === "Persevere") return "Persevere. You can hand this market to Lead finder.";
  if (v.shown === "Pivot") {
    if (v.closeMiss) {
      return "Close miss: " + t.hits + " of " + line.hits + " hair-on-fire, with a commitment. Extend to 15 calls before deciding?";
    }
    return "The pass line was not met. Sharpen the bet or try another market.";
  }
  if (t.n === 0) return "No calls yet. You can still change the pass line.";
  var need = line.hits - t.hits, left = t.target - t.n;
  if (need > 0) {
    return (need === 1 ? "One more hair-on-fire call" : plural(need, "more hair-on-fire call")) +
      " in the next " + left + " makes it Persevere. At Persevere you can hand this market to Lead finder.";
  }
  var lack = [];
  if (t.commits < line.commitments) lack.push("a commitment");
  if (t.orgs < 2) lack.push("a hit from a second organisation");
  if (t.buyers < 1) lack.push("a budget holder or decision maker");
  return "The hits are in. Still missing: " + lack.join(", ") + ".";
}

/* Records out of the store, by kind. */
function records(data) {
  var out = { markets: [], people: {}, calls: [], waves: [], drafts: [], suggest: {}, settings: (data && data.settings) || {} };
  for (var k in data || {}) {
    var v = data[k];
    if (!v || typeof v !== "object") continue;
    if (k.indexOf("market:") === 0) out.markets.push(Object.assign({ id: k.slice(7) }, v));
    else if (k.indexOf("person:") === 0) out.people[v.id || k.slice(7)] = Object.assign({ id: k.slice(7) }, v);
    else if (k.indexOf("call:") === 0) out.calls.push(Object.assign({ id: k.slice(5) }, v));
    else if (k.indexOf("draft:") === 0) out.drafts.push(Object.assign({ id: k.slice(6) }, v));
    else if (k.indexOf("suggest:") === 0) out.suggest[k.slice(8)] = v;
    else if (k.indexOf("wave:") === 0) out.waves.push(Object.assign({ key: k }, v));
  }
  out.markets.sort(function (a, b) { return (a.order || 0) - (b.order || 0); });
  return out;
}

/* The market the strip and the pages show: the chosen one, else the first. */
function activeOf(r) {
  var id = r.settings && r.settings.active;
  for (var i = 0; i < r.markets.length; i++) if (r.markets[i].id === id) return r.markets[i];
  return r.markets[0] || null;
}

function peopleOf(r, market) {
  var id = market && market.id;
  return Object.keys(r.people).map(function (k) { return r.people[k]; }).filter(function (p) { return p.market === id; });
}

function isPicked(p) {
  var c = p.channels || {};
  return !!(c.email || c.li || c.call);
}

/* The funnel for one market, as counts: found, asked, booked, called, and
   how many of the counted calls were hair-on-fire (level 4 or 5). */
function funnel(market, people, calls) {
  var mine = peopleOf({ people: peopleIndex(people) }, market);
  function n(statuses) { return mine.filter(function (p) { return statuses.indexOf(p.status) >= 0; }).length; }
  var t = tally(market, calls, people, 0);
  return [
    ["Found", mine.length],
    ["Asked", n(["asked", "booked", "called"])],
    ["Booked", n(["booked", "called"])],
    ["Called", n(["called"])],
    ["Hair on fire", t.hits],
  ];
}

/* What the founder does next, for the active market, as the strip and the
   zone badge say it. zone is one of the kit's zone keys; step is which of
   the four steps in the strip is current. */
function nextStep(r, now) {
  var m = activeOf(r);
  function out(zone, text, why, step) {
    var o = { zone: zone, text: text, why: why, step: step };
    if (m && r.suggest && r.suggest[m.id] && r.suggest[m.id].status === "open") o.also = "a sharper bet, suggested in Calls";
    return o;
  }
  if (!m || !m.bet) return out("markets", "Write your first bet", "So you know what to listen for. Do it in 1 · Markets.", 0);
  var mine = peopleOf(r, m);
  if (!mine.length) return out("markets", "Press Find people", "Scout looks for people already showing this pain. It is in 1 · Markets.", 1);
  var touched = mine.some(function (p) { return isPicked(p) || p.status === "asked" || p.status === "booked" || p.status === "called"; });
  if (!touched) return out("people", "Pick who to ask", "In 2 · People, then press Draft asks.", 1);
  var unsent = (r.drafts || []).filter(function (d) { return d.market === m.id && d.status === "draft"; });
  if (unsent.length) return out("send", "Send your asks", "Send the " + unsent.length + " from 3 · To send yourself, then press Sent on each.", 2);
  var booked = mine.some(function (p) { return p.status === "booked"; });
  var scored = marketCalls(m, r.calls).length;
  if (booked && !scored) return out("calls", "Drop the recording after your call", "Debrief scores it in 4 · Calls.", 3);
  var t = tally(m, r.calls, r.people, now == null ? Date.now() : now);
  return out("calls", verdictLine(m, t, verdict(m, t)), "", 3);
}
</script>

<script id="logic">
/* THIS PAGE'S RULES. Pure functions, no DOM, no window: pages.test.mjs
   pulls this block out of the page, after core, and runs it under node. */

var SOURCES = [
  { id: "apollo", label: "Apollo", note: "Your Apollo account. Searching is free. Nothing costs credits until you approve it." },
  { id: "web", label: "Web search", note: "No account needed. Scout searches forums, reviews and public posts for people already talking about the pain." },
  { id: "list", label: "My list", note: "Paste names or drop a CSV here. Scout fills in why each person fits." }
];
var WHY_LINE = "Ten calls is the usual floor for problem interviews. Three people with the pain this badly is more than an anecdote, and a commitment shows the interest is real. It is a small sample, so a miss is weaker evidence than a pass.";
var WEAKER = "Changing the line after calls makes the verdict weaker. Change anyway?";
var BET_FIELDS = [["who", "Who", "Who has the pain, in a few words"], ["pain", "What pain", "What goes wrong for them"], ["shown", "Shown by", "What they already do about it"], ["where", "Found where", "Where these people gather"]];

function sourceOf(id) {
  for (var i = 0; i < SOURCES.length; i++) if (SOURCES[i].id === id) return SOURCES[i];
  return SOURCES[1];
}

function parseList(text) {
  return String(text || "").split(/\r?\n/).map(function (l) { return l.trim(); }).filter(Boolean);
}

/* Where a card goes. The app writes each kit page a map of the kit's zone
   keys to the zones it placed ("kitZones"), so a renamed zone, or a second
   placing, still lands here. Without it the zone's plain name stands. */
function zoneFor(zones, key, name) {
  var id = zones && typeof zones === "object" ? zones[key] : "";
  return typeof id === "string" && id ? id : name;
}

function lineText(line) {
  return line.hits + " at level 4–5 in " + line.calls + " calls + " + plural(line.commitments, "commitment");
}

function canFind(market, source, list) {
  if (!market || !market.bet) return false;
  if (!market.bet.who || !market.bet.pain) return false;
  if (source === "list" && parseList(list).length === 0) return false;
  return true;
}

/* The card that lands in Markets. That landing is what runs Scout, so it
   says everything Scout needs: which market, the bet, where to look. */
function findCard(market, source, list, zones) {
  var b = market.bet || {};
  var name = market.name || "Unnamed market";
  var text = "Market: " + name + " (" + market.id + ")\nBet version: v" + betV(market) +
    "\n\n**Who:** " + (b.who || "") + "\n**What pain:** " + (b.pain || "") + "\n**Shown by:** " + (b.shown || "") + "\n**Found where:** " + (b.where || "") +
    "\n\nWhere to look: " + sourceOf(source).label;
  if (source === "list") text += "\n\nMy list:\n" + parseList(list).join("\n");
  return { zone: zoneFor(zones, "markets", "1 · Markets"), title: "Find people: " + name, text: text };
}

/* A new market, with the default pass line and the first version of the bet. */
function newMarket(id, name, bet, order) {
  return {
    id: id, name: name, order: order, source: "web",
    passLine: { hits: DEFAULT_LINE.hits, of: DEFAULT_LINE.calls, commits: DEFAULT_LINE.commitments },
    locked: false,
    bet: { v: 1, who: bet.who || "", pain: bet.pain || "", shown: bet.shown || "", where: bet.where || "", fromCalls: 0 },
    bets: []
  };
}

function slug(name) {
  return String(name || "market").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 24) || "market";
}

/* A line the founder typed, made safe: whole numbers, at least 1 call. */
function cleanLine(hits, of, commits) {
  function n(v, d, min) { v = Math.floor(Number(v)); return isFinite(v) && v >= min ? Math.min(v, 99) : d; }
  var o = n(of, DEFAULT_LINE.calls, 1);
  return { hits: Math.min(n(hits, DEFAULT_LINE.hits, 0), o), of: o, commits: n(commits, DEFAULT_LINE.commitments, 0) };
}

/* Everything the page draws, from the kit store's data. */
function marketsModel(data, now) {
  var r = records(data);
  var m = activeOf(r);
  var model = { empty: !m, tabs: [], market: null };
  model.tabs = r.markets.map(function (mk) {
    var t = tally(mk, r.calls, r.people, now);
    return { id: mk.id, name: mk.name || "Unnamed market", on: !!m && mk.id === m.id, verdict: verdictLabel(verdict(mk, t), t) };
  });
  if (!m) return model;
  var t = tally(m, r.calls, r.people, now);
  var v = verdict(m, t);
  var line = t.line;
  var v2 = betV(m) > 1;
  model.market = {
    id: m.id, name: m.name || "Unnamed market", bet: m.bet || null,
    versionTag: v2 ? "v" + betV(m) + " · from " + plural((m.bet && m.bet.fromCalls) || 0, "call") : "",
    lineText: lineText(line), line: line,
    locked: !!m.locked || lineLocked(m, r.calls, r.people),
    source: SOURCES.some(function (s) { return s.id === m.source; }) ? m.source : "web",
    list: m.list || "",
    peopleCount: Object.keys(r.people).filter(function (k) { return r.people[k].market === m.id; }).length,
    verdictLabel: verdictLabel(v, t), verdictLine: verdictLine(m, t, v), override: v.override || null, auto: v.auto,
    rows: [
      { label: "Calls counted", n: t.n, of: t.target, cells: cells(t.n, t.target), hot: false },
      { label: "Hair on fire (4–5)", n: t.hits, of: line.hits, cells: cells(t.hits, line.hits), hot: true },
      { label: "Commitments", n: t.commits, of: line.commitments, cells: cells(t.commits, line.commitments), hot: true }
    ]
  };
  return model;
}

function cells(n, total) {
  var out = [];
  for (var i = 0; i < total; i++) out.push(i < n);
  return out;
}
</script>

<script>
(function () {
  var app = document.getElementById("app");
  var kit = window.wibble && window.wibble.kit;
  var data = {};
  // What the founder has typed or opened, kept across redraws.
  var ui = { adding: false, form: { name: "", who: "", pain: "", shown: "", where: "" }, why: false, confirmLine: false, editLine: null, lists: {}, pressed: null, status: "" };

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function cellRow(c, cls) {
    return '<div class="dk-cells">' + c.map(function (on) { return "<i" + (on ? ' class="' + cls + '"' : "") + "></i>"; }).join("") + "</div>";
  }
  var LOCK = '<svg class="dk-ico" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="3.5" y="7" width="9" height="6.5" rx="1.5"></rect><path d="M5.5 7V5a2.5 2.5 0 0 1 5 0v2"></path></svg>';

  function field(label, id, value, area, ph) {
    var el = area
      ? '<textarea class="dk-in" id="' + id + '" rows="2" placeholder="' + esc(ph || "") + '">' + esc(value) + "</textarea>"
      : '<input class="dk-in" id="' + id + '" value="' + esc(value) + '" placeholder="' + esc(ph || "") + '">';
    return '<label class="dk-field"><span class="dk-cap">' + esc(label.toUpperCase()) + "</span>" + el + "</label>";
  }

  function addForm(first) {
    var f = ui.form;
    return '<div class="dk-card"><div class="dk-ttl">' + (first ? "Write your first bet" : "Add a market") + "</div>" +
      '<p class="dk-note">One bet per market: who has what pain, shown by what they already do, found where. You can be wrong about it.</p>' +
      '<div class="dk-form">' + field("Market name", "f-name", f.name, false, "Who, in a few words") +
      BET_FIELDS.map(function (b) { return field(b[1], "f-" + b[0], f[b[0]], true, b[2]); }).join("") +
      '<div class="dk-row"><button class="dk-btn" type="button" data-act="create"' + (f.name.trim() && f.who.trim() && f.pain.trim() ? "" : " disabled") + '>Add market</button>' +
      (first ? "" : '<button class="dk-btn dk-quiet" type="button" data-act="cancel">Cancel</button>') + "</div></div></div>";
  }

  function render() {
    if (!kit) return;
    var s = marketsModel(data, Date.now());
    if (s.empty) { app.innerHTML = addForm(true); return; }
    var m = s.market;
    var tabs = s.tabs.map(function (t) {
      return '<button class="dk-pill" type="button" data-tab="' + esc(t.id) + '" aria-pressed="' + t.on + '">' + esc(t.name) + "<span>" + esc(t.verdict) + "</span></button>";
    }).join("") + '<button class="dk-pill dk-add" type="button" data-act="add">+ Add a market</button>';
    if (ui.adding) { app.innerHTML = '<div class="dk-tabs">' + tabs + "</div>" + addForm(false); return; }

    var bet = m.bet || {};
    var rows = BET_FIELDS.map(function (b) { return "<dt>" + b[1] + "</dt><dd>" + esc(bet[b[0]]) + "</dd>"; }).join("");
    var lineRight = '<span class="dk-grow dk-right">' + (m.locked ? '<span class="dk-lock">' + LOCK + "Locked</span>" : "") +
      '<button class="dk-pill dk-sm" type="button" data-act="change">Change</button></span>';
    var lineExtra = "";
    if (ui.confirmLine) {
      lineExtra = '<div class="dk-ask"><p>' + esc(WEAKER) + '</p><button class="dk-pill dk-sm" type="button" data-act="change-anyway">Change anyway</button><button class="dk-pill dk-sm" type="button" data-act="keep-line">Keep it</button></div>';
    } else if (ui.editLine) {
      var e = ui.editLine;
      lineExtra = '<div class="dk-edit"><label>Hair on fire <input class="dk-in" id="l-hits" type="number" min="0" max="99" value="' + esc(e.hits) + '"></label>' +
        '<label>of calls <input class="dk-in" id="l-of" type="number" min="1" max="99" value="' + esc(e.of) + '"></label>' +
        '<label>Commitments <input class="dk-in" id="l-commits" type="number" min="0" max="99" value="' + esc(e.commits) + '"></label>' +
        '<button class="dk-pill dk-sm" type="button" data-act="save-line">Save line</button><button class="dk-pill dk-sm" type="button" data-act="keep-line">Cancel</button></div>';
    }
    var src = sourceOf(m.source);
    var segs = SOURCES.map(function (x) { return '<button class="dk-seg" type="button" data-src="' + x.id + '" aria-pressed="' + (x.id === m.source) + '">' + esc(x.label) + "</button>"; }).join("");
    var listVal = ui.lists[m.id] != null ? ui.lists[m.id] : m.list;
    var list = m.source === "list"
      ? '<textarea class="dk-in" id="list" rows="5" aria-label="My list" placeholder="One person per line, e.g. Dana Ruiz, Harbor Talent">' + esc(listVal) + "</textarea>" : "";
    var ok = canFind(Object.assign({ id: m.id }, { bet: m.bet }), m.source, listVal);
    var foundLine = "";
    if (ui.pressed && ui.pressed.market === m.id) {
      var grew = m.peopleCount - ui.pressed.before;
      foundLine = grew > 0 ? "Scout found " + plural(grew, "person", "people") + ". They are in People." : "Sent to Scout. New people land in People.";
    } else if (ui.status) foundLine = ui.status;
    var ver = m.versionTag ? '<div class="dk-tag dk-v2">' + esc(m.versionTag) + "</div>" : "";
    var over = m.override ? '<span class="dk-muted">yours · the board says ' + esc(m.auto) + "</span>" : '<span class="dk-muted dk-grow">worked out by the board, never by an agent</span>';
    var vrows = m.rows.map(function (x) {
      return '<div class="dk-vrow"><span>' + esc(x.label) + "</span>" + cellRow(x.cells, x.hot ? "dk-hot" : "dk-on") + '<span class="dk-n">' + x.n + " of " + x.of + "</span></div>";
    }).join("");

    app.innerHTML =
      '<div class="dk-tabs">' + tabs + "</div>" +
      '<div class="dk-card"><div class="dk-head"><div class="dk-ttl">The bet</div>' + ver + '<div class="dk-tag dk-grow">Could turn out wrong</div></div>' +
      '<dl class="dk-bet">' + rows + "</dl>" +
      '<div class="dk-hair"></div>' +
      '<div class="dk-line-row"><div class="dk-cap">PASS LINE</div><div>' + esc(m.lineText) + '</div><button class="dk-pill dk-sm dk-why" type="button" data-act="why">Why?</button>' + lineRight +
      (ui.why ? '<div class="dk-pop" role="note">' + esc(WHY_LINE) + "</div>" : "") + "</div>" + lineExtra +
      '<div class="dk-hair"></div>' +
      '<div class="dk-cap">WHERE TO LOOK</div><div class="dk-segs" role="group" aria-label="Where to look">' + segs + "</div>" +
      '<p class="dk-note">' + esc(src.note) + "</p>" + list +
      '<button class="dk-btn" type="button" data-act="find"' + (ok ? "" : " disabled") + ">" + (m.peopleCount ? "Find more people" : "Find people") + "</button>" +
      (foundLine ? '<div class="dk-found" role="status">' + esc(foundLine) + "</div>" : "") + "</div>" +
      '<div class="dk-verdict"><div class="dk-vhead"><div class="dk-cap">VERDICT</div><div class="dk-big">' + esc(m.verdictLabel) + "</div>" + over + "</div>" +
      vrows + '<p class="dk-note">' + esc(m.verdictLine) + "</p></div>";
  }

  function current() {
    var r = records(data);
    return activeOf(r);
  }
  function put(m) { kit.set("market:" + m.id, m); }
  function val(id) { var el = document.getElementById(id); return el ? el.value : ""; }

  function act(name) {
    var m = current();
    if (name === "add") { ui.adding = true; render(); return; }
    if (name === "cancel") { ui.adding = false; render(); return; }
    if (name === "create") {
      var f = ui.form;
      var r = records(data);
      var id = slug(f.name) + "-" + Math.random().toString(36).slice(2, 6);
      put(newMarket(id, f.name.trim(), { who: f.who.trim(), pain: f.pain.trim(), shown: f.shown.trim(), where: f.where.trim() }, r.markets.length));
      kit.set("settings", Object.assign({}, r.settings, { active: id }));
      ui.form = { name: "", who: "", pain: "", shown: "", where: "" };
      ui.adding = false;
      return;
    }
    if (!m) return;
    if (name === "why") { ui.why = !ui.why; render(); return; }
    if (name === "change") {
      var locked = marketsModel(data, Date.now()).market.locked;
      if (locked) ui.confirmLine = true; else ui.editLine = Object.assign({}, lineOf(m), { of: lineOf(m).calls, commits: lineOf(m).commitments });
      render(); return;
    }
    if (name === "change-anyway") { var l = lineOf(m); ui.confirmLine = false; ui.editLine = { hits: l.hits, of: l.calls, commits: l.commitments }; render(); return; }
    if (name === "keep-line") { ui.confirmLine = false; ui.editLine = null; render(); return; }
    if (name === "save-line") {
      var c = cleanLine(val("l-hits"), val("l-of"), val("l-commits"));
      ui.editLine = null;
      put(Object.assign({}, m, { passLine: c }));
      return;
    }
    if (name === "find") {
      var list = ui.lists[m.id] != null ? ui.lists[m.id] : (m.list || "");
      if (!canFind(m, m.source || "web", list)) return;
      var card = findCard(m, m.source || "web", list, window.wibble.get("kitZones"));
      var before = Object.keys(records(data).people).filter(function (k) { return records(data).people[k].market === m.id; }).length;
      put(Object.assign({}, m, { list: list }));
      ui.status = "";
      Promise.resolve().then(function () { return window.wibble.land(card); })
        .then(function () { ui.pressed = { market: m.id, before: before }; render(); })
        .catch(function () { ui.status = "Couldn't send that to Scout. Try again."; render(); });
    }
  }

  if (!kit) {
    app.innerHTML = '<p class="dk-empty">Place this kit from the zone menu.</p>';
    return;
  }
  app.addEventListener("click", function (e) {
    var t = e.target.closest ? e.target : null;
    if (!t) return;
    var tab = t.closest("[data-tab]"), src = t.closest("[data-src]"), a = t.closest("[data-act]");
    if (tab) {
      ui.adding = false; ui.confirmLine = false; ui.editLine = null; ui.pressed = null; ui.status = "";
      kit.set("settings", Object.assign({}, (data && data.settings) || {}, { active: tab.getAttribute("data-tab") }));
    } else if (src) {
      var m = current();
      if (m) put(Object.assign({}, m, { source: src.getAttribute("data-src") }));
    } else if (a) act(a.getAttribute("data-act"));
  });
  app.addEventListener("input", function (e) {
    var id = e.target.id || "";
    if (id.indexOf("f-") === 0) {
      ui.form[id.slice(2)] = e.target.value;
      var b = app.querySelector('[data-act="create"]');
      if (b) b.disabled = !(ui.form.name.trim() && ui.form.who.trim() && ui.form.pain.trim());
    } else if (id === "list") {
      var m = current();
      if (m) {
        ui.lists[m.id] = e.target.value;
        var go = app.querySelector('[data-act="find"]');
        if (go) go.disabled = !canFind(m, "list", e.target.value);
      }
    }
  });
  kit.subscribe(function (d) {
    data = d || {};
    // Don't redraw under a field the founder is typing in.
    var ae = document.activeElement;
    if (ae && ae.matches && ae.matches("input,textarea") && app.contains(ae)) return;
    render();
  });
})();
</script>
</body>
</html>
