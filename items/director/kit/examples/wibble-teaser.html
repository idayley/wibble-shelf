<!doctype html>
<meta charset="utf-8">
<title>Wibble, the teaser</title>
<style>
/* The teaser's own props, as it was cut for Wibble. */
.cam { position: absolute; inset: 0; transform-origin: 0 0; }
.cam > * { position: absolute; }
.streak { position: absolute; left: 0; top: 0; height: 12px; border-radius: 6px; background: var(--ink); z-index: 30; }
.flash { inset: 0; background: #fff; pointer-events: none; }
/* cold open */
.dots { left: -2000px; top: -2000px; width: 5080px; height: 5080px; background-image: radial-gradient(var(--dot) 2.4px, transparent 2.9px); background-size: 38px 38px; }
.term { left: 0; top: 0; width: 900px; height: 700px; transform-origin: 450px 350px; background: var(--term); border-radius: 30px; box-shadow: 0 40px 80px -30px rgba(20, 16, 40, .5); overflow: hidden; color: #ebe9f2; }
.tb { height: 64px; display: flex; align-items: center; gap: 12px; padding: 0 28px; background: #221f29; font: 500 22px var(--mono); color: #8e8a9e; }
.tb i { width: 16px; height: 16px; border-radius: 50%; background: #3b3845; }
.tb span { margin-left: 14px; }
.tx { margin: 0; padding: 30px 40px; font: 400 28px/1.62 var(--mono); white-space: pre-wrap; }
.tx .d { color: #8e8a9e; } .tx .a { color: #d97757; } .tx .g { color: #6fcf97; }
.tx .cur { display: inline-block; width: .6em; height: 1.1em; vertical-align: -.2em; background: #ebe9f2; }
.ring { left: 0; top: 0; border-radius: 50%; border: 14px solid var(--accent); }
.still { left: 240px; width: 600px; top: 770px; text-align: center; transform-origin: 50% 0; }
.still span { display: inline-block; font: 700 26px/1 var(--sans); background: var(--ink); color: #fff; padding: 14px 22px; border-radius: 999px; }
.still span b { display: inline-block; width: 12px; height: 12px; border-radius: 50%; background: #6fcf97; margin-right: 12px; vertical-align: 2px; }

.pin { background: var(--card); border: 2px solid var(--line); border-radius: 24px; box-shadow: 0 30px 60px -30px var(--shade); padding: 24px 28px; transform-origin: 50% 100%; overflow: hidden; }
.pk { font: 700 17px/1 var(--sans); letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }
.pt { font: 700 30px/1.22 var(--sans); margin-top: 10px; }
.bars { position: absolute; left: 28px; right: 28px; bottom: 26px; height: 180px; display: flex; align-items: flex-end; gap: 14px; }
.bars i { flex: 1; border-radius: 9px 9px 3px 3px; background: oklch(66% 0.16 250); transform-origin: 50% 100%; }
.bars i:last-child { background: var(--accent); }
.mini { position: absolute; left: 28px; right: 28px; top: 118px; bottom: 26px; border: 2px solid var(--line); border-radius: 14px; overflow: hidden; }
.mini .mnav { position: absolute; left: 16px; right: 16px; top: 14px; height: 14px; border-radius: 7px; background: var(--floor); }
.mini .mhero { position: absolute; left: 16px; right: 16px; top: 42px; height: 96px; border-radius: 12px; background: linear-gradient(120deg, oklch(70% 0.15 200), oklch(64% 0.18 280)); }
.m3 { position: absolute; left: 16px; right: 16px; bottom: 16px; height: 44px; display: flex; gap: 12px; }
.m3 i { flex: 1; border-radius: 10px; background: var(--floor); }
.ck { display: flex; align-items: center; gap: 16px; font: 600 26px/1 var(--sans); margin-top: 26px; color: var(--muted); }
.ck i { width: 30px; height: 30px; border-radius: 9px; border: 3px solid var(--line); display: grid; place-items: center; font: 800 20px/1 var(--sans); font-style: normal; color: #fff; }
.ck.on { color: var(--ink); }
.ck.on i { background: var(--ink); border-color: var(--ink); }
.photo { padding: 18px; }
.photo .img { height: 340px; border-radius: 12px; background: radial-gradient(circle at 50% 44%, oklch(62% 0.22 20) 0 64px, transparent 65px), radial-gradient(circle at 30% 30%, oklch(88% 0.08 80), oklch(78% 0.1 40)); }
.photo .pt { font-size: 28px; margin-top: 18px; }
.df { margin: 20px 0 0; font: 500 23px/1.7 var(--mono); white-space: pre; }
.df .dm { color: #b8453f; } .df .dp { color: var(--ok); }

/* models */
.win { background: var(--card); border: 2px solid var(--line); border-radius: 30px; box-shadow: 0 30px 70px -40px var(--shade); overflow: hidden; }
.tb2 { height: 58px; display: flex; align-items: center; gap: 12px; padding: 0 26px; background: var(--floor); font: 600 22px var(--sans); color: var(--muted); border-bottom: 2px solid var(--line); }
.tb2 i { width: 15px; height: 15px; border-radius: 50%; background: #d3d0dc; }
.tb2 span { margin-left: 12px; }
.split { position: absolute; left: 0; right: 0; top: 378px; border-top: 2px dashed var(--line); }
.eng { display: flex; align-items: center; gap: 12px; font: 700 26px/1 var(--sans); background: var(--floor); padding: 10px 18px 10px 10px; border-radius: 999px; }
.eng b { width: 38px; height: 38px; border-radius: 11px; background: var(--ink); color: #fff; display: grid; place-items: center; font: 700 18px/1 var(--mono); }
.bub { background: var(--card); border: 2px solid var(--line); border-radius: 26px; padding: 18px 26px; font: 600 30px/1.3 var(--sans); box-shadow: 0 16px 30px -18px var(--shade); transform-origin: 0 100%; max-width: 620px; white-space: pre-wrap; }
.bub.me { background: var(--ink); color: #fff; border-color: var(--ink); transform-origin: 100% 100%; }
.bub .gh { visibility: hidden; }
.dlab { font: 700 30px/1 var(--sans); transform-origin: 0 100%; white-space: nowrap; }
.dlab b { color: var(--ok); }
.track { border-radius: 11px; background: var(--floor); overflow: hidden; }
.track i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, oklch(66% 0.2 150), oklch(66% 0.2 172)); border-radius: 11px; }
.cf { left: 0; top: 0; border-radius: 3px; }

/* plans */
.edges { left: 0; top: 0; width: 1080px; height: 1080px; overflow: visible; }
.edges path { fill: none; stroke-width: 6; stroke-linecap: round; }
.edges .base { stroke: #cfccd9; }
.edges .over { stroke: var(--ink); }
.node { width: 400px; height: 112px; background: var(--card); border: 4px solid #cfccd9; border-radius: 26px; padding: 18px 24px; transform-origin: 50% 50%; box-shadow: 0 18px 30px -22px var(--shade); }
.node .kind { font: 700 16px/1 var(--sans); letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }
.node .nl { font: 700 30px/1.2 var(--sans); margin-top: 10px; white-space: nowrap; }
.node .led { position: absolute; right: 20px; top: 16px; width: 26px; height: 26px; border-radius: 50%; background: #dcdae3; display: grid; place-items: center; font: 800 16px/1 var(--sans); font-style: normal; color: #fff; }
.node .tape { position: absolute; left: 24px; right: 24px; bottom: 12px; height: 8px; border-radius: 4px; background: var(--floor); overflow: hidden; }
.node .tape i { display: block; height: 100%; width: 0; border-radius: 4px; }
.node .you { position: absolute; right: 20px; bottom: 16px; font: 800 16px/1 var(--sans); letter-spacing: .06em; text-transform: uppercase; background: var(--accent); color: #fff; padding: 8px 12px; border-radius: 999px; }

/* options */
.opt { left: 0; top: 0; width: 240px; height: 320px; background: var(--card); border: 3px solid var(--line); border-radius: 22px; box-shadow: 0 26px 40px -26px var(--shade); transform-origin: 50% 50%; padding: 14px; }
.opt .ol { position: absolute; left: -14px; top: -14px; width: 46px; height: 46px; border-radius: 50%; background: var(--ink); color: #fff; display: grid; place-items: center; font: 800 22px/1 var(--sans); }
.opt .nav { height: 12px; border-radius: 6px; background: var(--floor); width: 60%; margin-left: auto; }
.opt .hero { margin-top: 12px; height: 130px; border-radius: 12px; }
.opt .r3 { display: flex; gap: 8px; margin-top: 12px; }
.opt .r3 i { flex: 1; height: 56px; border-radius: 8px; background: var(--floor); }
.opt .ln { height: 12px; border-radius: 6px; background: var(--floor); margin-top: 12px; width: 80%; }
.opt.a .hero { background: linear-gradient(135deg, oklch(72% 0.13 230), oklch(62% 0.16 260)); }
.opt.b .hero { background: radial-gradient(circle at 72% 50%, oklch(62% 0.22 20) 0 34px, transparent 35px), linear-gradient(90deg, #fff 0 50%, oklch(94% 0.03 20) 50%); border: 2px solid var(--line); }
.opt.c .hero { background: linear-gradient(160deg, #26242e, #3b3748); }
.stamp { left: 0; top: 0; font: 800 34px/1 var(--sans); color: var(--accent); border: 5px solid var(--accent); border-radius: 14px; padding: 10px 16px; letter-spacing: .06em; text-transform: uppercase; background: rgba(255,255,255,.85); }
.ptr { left: 0; top: 0; width: 44px; height: 60px; filter: drop-shadow(0 4px 5px var(--shade)); }
.ptr svg { width: 100%; height: 100%; display: block; }

/* phone */
.dev { background: var(--card); border-style: solid; border-color: var(--ink); overflow: hidden; box-shadow: 0 40px 80px -40px var(--shade); }
.dev > div { position: absolute; inset: 0; }
.desk .side { position: absolute; left: 0; top: 0; bottom: 0; width: 170px; background: var(--floor); }
.desk .side i { display: block; height: 16px; border-radius: 8px; background: #d8d5e1; margin: 26px 22px 0; }
.desk .blk { position: absolute; border-radius: 16px; border: 2px solid var(--line); background: #fbfbfd; }
.phonec .bar { position: absolute; left: 30px; right: 30px; top: 20px; display: flex; justify-content: space-between; font: 700 20px/1 var(--sans); }
.phonec .ttl { position: absolute; left: 30px; top: 78px; font: 800 36px/1 var(--sans); }
.pcard { position: absolute; left: 22px; right: 22px; top: 150px; height: 330px; border: 2px solid var(--line); border-radius: 26px; padding: 26px; background: #fbfbfd; }
.pcard .pk { font-size: 15px; }
.pcard h3 { margin: 12px 0 8px; font: 800 32px/1.15 var(--sans); }
.pcard p { margin: 0; font: 500 22px/1.35 var(--sans); color: var(--muted); }
.pbtn { position: absolute; bottom: 24px; height: 64px; border-radius: 18px; display: grid; place-items: center; font: 800 24px/1 var(--sans); }
.pbtn.no { left: 20px; width: 112px; font-size: 21px; background: var(--floor); }
.pbtn.yes { right: 20px; width: 150px; font-size: 21px; background: var(--ink); color: #fff; }
.note { position: absolute; left: 14px; right: 14px; top: 0; height: 104px; border-radius: 24px; background: rgba(250,250,252,.97); border: 2px solid var(--line); box-shadow: 0 18px 30px -18px var(--shade); display: flex; align-items: center; gap: 14px; padding: 0 18px; font: 600 21px/1.25 var(--sans); }
.note b { flex: none; width: 50px; height: 50px; border-radius: 14px; background: linear-gradient(158deg, oklch(72% 0.17 20), oklch(66% 0.22 352)); color: #fff; display: grid; place-items: center; font: 800 26px/1 var(--sans); }
.note small { display: block; color: var(--muted); font-weight: 500; }
.thumb { left: 0; top: 0; width: 110px; height: 110px; border-radius: 50%; background: rgba(31,30,37,.16); border: 4px solid rgba(31,30,37,.4); }
.okring { left: 0; top: 0; border-radius: 50%; border: 8px solid var(--ok); }

/* shelf */
.tabs2 { left: 70px; top: 262px; display: flex; gap: 10px; }
.tabs2 span { font: 700 22px/1 var(--sans); padding: 12px 18px; border-radius: 999px; background: var(--floor); color: var(--muted); }
.tabs2 span:first-child { background: var(--ink); color: #fff; }
.plank { left: 60px; width: 960px; height: 24px; border-radius: 6px; background: #d9d5e3; box-shadow: 0 6px 0 #c7c2d4, 0 20px 24px -14px var(--shade); }
.tile { left: 0; top: 0; width: 200px; height: 236px; background: var(--card); border: 2px solid var(--line); border-radius: 22px; padding: 16px; transform-origin: 50% 100%; box-shadow: 0 16px 30px -20px var(--shade); }
.tile .pk { font-size: 14px; }
.tile .ic { margin-top: 12px; height: 92px; border-radius: 14px; display: grid; place-items: center; font: 800 44px/1 var(--sans); color: #fff; }
.tile .tn { margin-top: 12px; font: 800 23px/1.1 var(--sans); white-space: nowrap; }
.tile .add { position: absolute; right: 12px; top: 12px; width: 36px; height: 36px; border-radius: 50%; background: var(--ink); color: #fff; display: grid; place-items: center; font: 800 24px/1 var(--sans); }
.toast { right: 60px; top: 262px; font: 700 23px/1 var(--sans); background: var(--ink); color: #fff; padding: 14px 20px; border-radius: 16px; transform-origin: 100% 0; white-space: nowrap; }
.toast b { color: #6fcf97; }

/* charm */
.composer { left: 140px; top: 900px; width: 800px; height: 92px; border-radius: 46px; background: var(--card); border: 2px solid var(--line); box-shadow: 0 16px 30px -22px var(--shade); display: flex; align-items: center; padding: 0 36px; font: 500 30px/1 var(--sans); color: var(--muted); }
.stopb { position: absolute; right: 14px; top: 12px; width: 64px; height: 64px; border-radius: 50%; background: var(--ink); display: grid; place-items: center; }
.stopb i { width: 22px; height: 22px; border-radius: 4px; background: #fff; }
.tag { left: 140px; width: 800px; top: 300px; text-align: center; transform-origin: 50% 100%; }
.tag span { display: inline-block; font: 800 34px/1 var(--sans); padding: 16px 26px; border-radius: 999px; background: var(--floor); }
.tag span.bad { background: var(--alert); color: #fff; }
.tag span.good { background: var(--ok); color: #fff; }
.rod { left: 0; top: 0; width: 1080px; height: 1080px; overflow: visible; }
.star { left: 0; top: 0; width: 40px; height: 40px; background: oklch(82% 0.16 88); clip-path: polygon(50% 0, 62% 38%, 100% 50%, 62% 62%, 50% 100%, 38% 62%, 0 50%, 38% 38%); }

/* end */
.tagline { left: 40px; right: 40px; top: 694px; text-align: center; font: 800 66px/1.08 var(--sans); letter-spacing: -0.025em; transform-origin: 50% 100%; }
.tagline em { font-style: normal; color: var(--accent); }
.engs { left: 40px; right: 40px; top: 862px; display: flex; justify-content: center; gap: 12px; transform-origin: 50% 0; }
.engs span { font: 700 28px/1 var(--sans); background: var(--floor); padding: 12px 20px; border-radius: 999px; }
.free { left: 40px; right: 40px; top: 940px; text-align: center; font: 800 38px/1 var(--sans); letter-spacing: -0.01em; transform-origin: 50% 0; }
.free em { font-style: normal; color: var(--accent); }
.url { left: 40px; right: 40px; top: 996px; text-align: center; font: 500 34px/1 var(--mono); color: var(--muted); transform-origin: 50% 0; }
</style>
<body>
<script src="https://cdn.jsdelivr.net/gh/idayley/wibble-shelf@cc3485ba7e2ecaa06ac008ef1adac9f59c62f7f7/items/director/kit/motion.js"></script>
<script>
// The film Director was made from: Wibble's 36-second launch teaser, whole.
// Read it for the moves -- the terminal breaking open, a stampede that spells
// a name, a pointer that picks, a phone that squeezes out of a desk.
const END = 36000;
film({ title: "Wibble, the teaser", end: END, whip: 420 });

scene(0, 10800, (root, at) => {
  const cam = el("div", "cam", root);
  const dots = el("div", "dots", cam);
  const PINS = [
    { x: -300, y: 20, w: 520, h: 340, rot: -2, html: `<div class="pk">Chart</div><div class="pt">Build time, last 7 runs</div><div class="bars">${[88, 74, 80, 61, 52, 44, 36].map(v => `<i style="height:${v}%"></i>`).join("")}</div>` },
    { x: 860, y: 0, w: 520, h: 360, rot: 2, html: `<div class="pk">Live page</div><div class="pt">localhost:5173</div><div class="mini"><i class="mnav"></i><i class="mhero"></i><div class="m3"><i></i><i></i><i></i></div></div>` },
    { x: 900, y: 470, w: 420, h: 470, rot: 4, cls: "photo", html: `<div class="img"></div><div class="pt">New logo, take 3</div>` },
    { x: -320, y: 480, w: 460, h: 400, rot: 1.5, html: `<div class="pk">Checklist</div><div class="pt">Release</div>${["Bump the version", "Write the changelog", "Run the full suite", "Tag and push"].map(s => `<div class="ck"><i>✓</i>${s}</div>`).join("")}` },
    { x: -200, y: 960, w: 520, h: 290, rot: -1.5, html: `<div class="pk">Diff</div><pre class="df"><span class="dm">- const total = sum(items)</span>\n<span class="dp">+ const total = subtotal(cart)</span>\n<span class="dp">+   .withTax(region)</span></pre>` },
    { x: 860, y: 1010, w: 480, h: 260, rot: -3, html: `<div class="pk">Note</div><div class="pt">Check the coupon rule before Friday.</div>` },
  ].map(d => ({ ...d, e: pos(el("div", "pin " + (d.cls || ""), cam, d.html), d.x, d.y, d.w, d.h) }));
  const term = el("div", "term", cam, `<div class="tb"><i></i><i></i><i></i><span>claude — ~/shop</span></div><pre class="tx"></pre>`);
  const tx = term.querySelector(".tx");
  const chip = el("div", "still", cam, `<span><b></b>Your terminal, still running</span>`);
  const ring = el("div", "ring", cam);
  const tr = troupe(cam);
  const W = tr.add("W", 900, { h: 150, logo: true, ph: 0.1 });
  W.at(3380, 540, -300).arc(540, 0, 820, { peak: 380, spin: 360 }).plop(560, { big: true })
    .until(5500).hop(640, { to: 860, H: 60 }).until(6500).hop(480, { H: 34 })
    .until(8900).arc(560, -470, 760, { peak: 220 }).plop(440).until(9950).hop(640, { H: 80 }).until(40000);
  const r = rng(7);
  "ABCDEFGHKMNPRSTUVYZ".split("").forEach((ch, i) => {
    const gy = 872 + r() * 110, a = tr.add(ch, gy, { h: 108, slot: i });
    const lx = 90 + r() * 900, spin = r() < 0.35 ? (r() < 0.5 ? 360 : -360) : 0;
    a.at(3600 + i * 50, 540 + (r() - 0.5) * 140, 585 - gy).arc(lx, 0, 620 + r() * 260, { peak: 250 + r() * 260, spin }).plop(360).hold(120 + r() * 380);
    const out = lx < 540 ? -200 : 1280;
    a.run(out, Math.abs(out - lx) / 1.5, { dust: true, stride: 150, jump: 30 }).gone();
  });
  tr.sortZ();
  const bang = el("div", "flash", root);
  const LINES = [
    [300, '<span class="d">~/shop $</span> ', "claude"],
    [850, '<span class="a">✻</span> Welcome to Claude Code'],
    [900, ""],
    [1050, '<span class="d">&gt;</span> ', "tidy up the checkout flow"],
    [2000, '<span class="a">⏺</span> Read(src/checkout.ts)'],
    [2250, '<span class="a">⏺</span> Update(src/cart.ts)'],
    [2350, '  <span class="d">⎿  +48 −31</span>'],
    [2600, '<span class="a">⏺</span> Bash(npm test)'],
    [6000, '  <span class="g">⎿  ✓ 214 tests passed</span>'],
  ];
  for (const L of LINES) {
    if (L[2]) for (let i = 0; i < L[2].length; i++) at(L[0] + i * 45, "type", 0.55, 300);
    else if (L[1]) at(L[0], "type", 0.3, 300);
  }
  at(2300, "shake", 1); at(3380, "burst", 1); at(4700, "bubble", 0.7); at(7400, "whip", 0.35);
  PINS.forEach((p, i) => at(8000 + i * 170, "pin", 0.7, 540 + (p.x + p.w / 2 - 540) * 0.6));
  function termAt(lt) {
    if (lt < 3420) return { x: 90, y: 270, s: 1 };
    const k = eob(tl(lt, 3420, 4070));
    return { x: lerp(90, 340, k), y: lerp(270, 430, k), s: lerp(1, 0.4444, k) };
  }
  return lt => {
    const s = lerp(1, 0.6, eio(tl(lt, 7400, 8300)));
    cam.style.transform = `translate(540px, 640px) scale(${s}) translate(-540px, -640px)`;
    dots.style.opacity = String(tl(lt, 4300, 5100));

    let jx = 0, jy = 0, jr = 0, bx = 1, by = 1;
    if (lt > 2300 && lt < 3420) { const a = 13 * Math.pow(tl(lt, 2300, 3400), 2); jx = a * Math.sin(lt / 17); jy = a * Math.cos(lt / 23); jr = a * 0.1 * Math.sin(lt / 29); }
    if (lt > 3050 && lt < 3420) { const u = tl(lt, 3050, 3420), w = Math.sin(u * Math.PI * 4) * u; bx = 1 + 0.06 * w; by = 1 - 0.05 * w; }
    const R = termAt(lt);
    term.style.transform = `translate(${R.x + jx - 450 * (1 - R.s)}px, ${R.y + jy - 350 * (1 - R.s)}px) rotate(${jr}deg) scale(${R.s * bx}, ${R.s * by})`;
    let html = "";
    for (const L of LINES) {
      if (lt < L[0]) break;
      html += L[1] + (L[2] ? L[2].slice(0, Math.floor((lt - L[0]) / 45)) : "") + "\n";
    }
    if (Math.floor(lt / 500) % 2 === 0) html += '<span class="cur"></span>';
    tx.innerHTML = html;

    const ru = tl(lt, 3380, 3950);
    if (ru > 0 && ru < 1) { const d = 60 + 1500 * eo3(ru); ring.style.display = "block"; ring.style.opacity = String(1 - ru); ring.style.width = ring.style.height = `${d}px`; ring.style.transform = `translate(${540 - d / 2}px, ${620 - d / 2}px)`; }
    else ring.style.display = "none";
    bang.style.opacity = lt >= 3380 && lt < 3620 ? String(0.75 * (1 - tl(lt, 3380, 3620))) : "0";
    popIn(chip, tl(lt, 4700, 5120));

    PINS.forEach((p, i) => {
      const t0 = 8000 + i * 170;
      popIn(p.e, tl(lt, t0, t0 + 460), p.rot, -90);
      p.e.querySelectorAll(".bars i").forEach((b, k) => { b.style.transform = `scaleY(${eob(tl(lt, t0 + 250 + k * 60, t0 + 650 + k * 60))})`; });
      p.e.querySelectorAll(".ck").forEach((c, k) => c.classList.toggle("on", k < 3 && lt > t0 + 450 + k * 260));
    });
    tr.draw(lt);
  };
});

// 4. Two engines, one window.
scene(10800, 14200, (root, at) => {

      else { const k = tl(l, 780, 950), e = Math.exp(-5 * k) * Math.cos(k * 14); p = { y: 0, sx: 1.055 + 0.3 * e, sy: 0.945 - 0.28 * e }; }
      put(wm, 540, 880, p);
      cf(540, 700, l - 250);
    } else if (v === 2) {
      const hit = tl(l, 0, 160), w = Math.sin(l / 70);
      p = hit < 1 ? { y: 0, sx: lerp(1.5, 1.2, hit), sy: lerp(0.5, 0.8, hit) } : { y: 0, sx: 1.12 + 0.05 * w, sy: 0.86 - 0.05 * w, rot: 11 * Math.sin(l / 120) };
      put(wm, 540, 880, p);
    } else put(wm, 0, 0, null);
    if (v !== 1) cf(0, 0, -1);
    stars.forEach((s, i) => {
      if (v !== 2 || l < 120) { s.style.display = "none"; return; }
      const a = l / 170 + (i * Math.PI * 2) / 3, depth = 0.75 + 0.25 * Math.sin(a);
      s.style.display = "block";
      s.style.transform = `translate(${540 + 130 * Math.cos(a) - 20}px, ${690 + 26 * Math.sin(a) - 20}px) scale(${depth}) rotate(${l / 4}deg)`;
    });
    const sp = v === 3 && l < 220 ? Math.sin(tl(l, 0, 220) * Math.PI) : 0;
    stopb.style.transform = `scale(${1 - 0.2 * sp})`;
    stopb.style.boxShadow = v === 3 ? `0 0 0 ${10 * sp}px color-mix(in oklab, var(--ink) 20%, transparent)` : "none";
    tr.draw(lt);
  };
});

// 10. The name.

  const slots = [...WORD].map(c => { const w = H * ASPECT[c], cx = x + w / 2; x += w + GAP; return cx; });
  const word = [];

    word[i] = a;

  W.at(1150, -200).run(40, 420, { dust: true, stride: 150 }).arc(slots[0], 0, 760, { peak: 320, spin: 360 }).plop(560, { big: true });
  word[0] = W;
  word.forEach((a, i) => a.until(2750 + i * 80).hop(520, { H: 56 }).until(9000));
  tr.sortZ();
  [0, 1, 2, 3, 4, 5].forEach(i => at(2750 + i * 80 + 62, "note:" + ["c4", "e4", "g4", "c5", "d5", "e5"][i], 0.8, slots[i]));
  at(2800, "bubble", 0.6); at(3100, "pin", 0.5); at(3450, "type", 0.4);
  const tag = el("div", "tagline", root, "Your coding agents,<br><em>on a canvas.</em>");
  const engs = el("div", "engs", root, "<span>Claude Code</span><span>Codex</span><span>OpenCode</span>");
  const free = el("div", "free", root, "<em>Free</em> and source available");
  const url = el("div", "url", root, "github.com/idayley/wibble");
  return lt => {
    popIn(tag, tl(lt, 2500, 2950), 0, 40);
    popIn(engs, tl(lt, 2800, 3200), 0, 20);
    popIn(free, tl(lt, 3100, 3500), 0, 20);
    popIn(url, tl(lt, 3450, 3850), 0, 20);
    tr.draw(lt);
  };
});
