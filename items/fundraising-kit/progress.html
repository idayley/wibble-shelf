<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The round</title>
<!--
  THE ROUND STRIP. Placed by the Fundraising kit in its The round zone.
  It reads the kit store (window.wibble.kit): the round's dates, the four
  phases, the investors, the drafts and the field notes read. It shows
  today's date, how long is left, the four phases and the one thing to do
  next.

  It writes only to settings: settings.peek (a phase to read ahead on, or
  null for today's), settings.openNote (a field note for the Field guide
  to open once), and settings.round.start the first time it runs, so the
  phases stay put after the day the kit is placed.

  It also rings the zone that has the next step (wibble.mark), once each
  time that zone changes.

  The shared rules are in the first script block, pasted from core.js by
  sync-core.mjs. The strip's own rules are in the second, with no DOM, so
  pages.test.mjs can run them under node.

  Classes start with fr- on purpose: the frame drops any kit rule whose
  class a page's stylesheet also names.
-->
<style>
body{margin:0;padding:16px;font:13px/1.5 var(--sans,"Noto Sans",system-ui,sans-serif);color:var(--text,#ddd)}
.fr-wrap{display:flex;flex-wrap:wrap;align-items:stretch;gap:14px 18px}
.fr-cap{font:700 11px/1.2 var(--mono,"Geist Mono",ui-monospace,monospace);letter-spacing:.06em;color:var(--muted,#999);white-space:nowrap}
.fr-round{flex:0 0 150px;display:flex;flex-direction:column;gap:2px;justify-content:center}
.fr-today{font-size:13px;font-weight:600}
.fr-weeks{font-size:11.5px;color:var(--muted,#9a9a9a)}
.fr-phases{flex:1 1 520px;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start}
.fr-phase{flex:1 1 150px;display:flex;flex-direction:column;gap:3px;border-radius:10px;background:var(--win,#1d1d1d)}
.fr-phase.fr-now{background:rgba(240,207,168,.1);box-shadow:inset 0 0 0 1px rgba(240,207,168,.55)}
.fr-phase.fr-peeking{background:rgba(156,192,245,.08);box-shadow:inset 0 0 0 1px rgba(156,192,245,.5)}
.fr-pick{display:flex;flex-direction:column;align-items:flex-start;gap:3px;width:100%;padding:9px 12px;border:0;border-radius:10px;background:transparent;color:inherit;font:inherit;text-align:left;cursor:pointer}
.fr-pick:focus-visible,.fr-new:focus-visible{outline:2px solid var(--text,#ddd);outline-offset:2px}
.fr-phase-h{display:flex;align-items:center;gap:7px;width:100%;font-size:13px;font-weight:600}
.fr-dot{flex:none;width:18px;height:18px;border-radius:9px;display:inline-flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:700;background:var(--edge,#333);color:var(--muted,#aaa)}
.fr-done .fr-dot{background:#6ec48c;color:#0f2016}
.fr-now .fr-dot{background:#f0cfa8;color:#241a0e}
.fr-dates{margin-left:auto;font:11px var(--mono,"Geist Mono",ui-monospace,monospace);color:var(--muted,#9a9a9a)}
.fr-why{font-size:11.5px;line-height:1.4;color:var(--muted,#9a9a9a)}
.fr-new{margin:0 12px 9px;padding:0;border:0;background:transparent;font:inherit;font-size:11.5px;font-weight:600;color:#9cc0f5;text-align:left;cursor:pointer}
.fr-next{flex:0 1 300px;display:flex;flex-direction:column;gap:4px;padding-left:18px;border-left:1px solid var(--hair,rgba(255,255,255,.08))}
.fr-next .fr-cap{color:#f0cfa8}
.fr-line{font-size:13px;line-height:1.45}
.fr-start{display:flex;flex-direction:column;gap:4px;margin-top:4px}
.fr-step{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted,#aaa)}
.fr-step .fr-dot{width:16px;height:16px;border-radius:8px;font-size:10px;box-shadow:inset 0 0 0 1.5px var(--muted,#5a6b85);background:transparent}
.fr-step.fr-ok{color:var(--text,#ddd)}
.fr-step.fr-ok .fr-dot{background:#6ec48c;color:#0f2016;box-shadow:none}
.fr-also{font-size:11.5px;color:#e8b48a}
.fr-empty{margin:0;font-size:13px;color:var(--muted,#999)}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="fr-wrap" id="app"></div>

<script id="core">
/* THE FUNDRAISING KIT'S SHARED RULES. Every page needs the same phase,
   the same "next for you", the same idea of quiet and the same field
   notes, or the strip, the pages and the agents drift apart. Pure
   functions, no DOM, no window. This file is the only copy:
   sync-core.mjs pastes it into each page's <script id="core">, and
   core.test.mjs runs it under node.

   Dates are ISO day strings ("2026-10-01") in the operator's local time. */

var DAY = 24 * 60 * 60 * 1000;
var QUIET_AFTER = 10;
var PREPARE_DAYS = 20;
var MEETINGS_BEFORE_CLOSE = 15;

var STEPS = ["Researched", "Intro asked", "Intro made", "First meeting", "Follow-up", "Partner meeting", "Diligence", "Terms", "Signed"];

var PHASES = [
  { name: "Prepare", why: "Story, investor list, first updates to people you know" },
  { name: "Meetings", why: "First meetings packed close so interest overlaps" },
  { name: "Close", why: "Leads first, a deadline, SAFEs signed" },
  { name: "Backup", why: "A second wave or a smaller angel round" },
];

var SRC_PG = "Paraphrasing Paul Graham, “How to Raise Money”";
var SRC_SU = "Paraphrasing Mark Suster, “Invest in Lines, Not Dots”";
var SRC_VD = "Paraphrasing Brad Feld & Jason Mendelson, Venture Deals";
var SRC_SH = "Paraphrasing Scott Kupor, Secrets of Sand Hill Road";
var SRC_HO = "Paraphrasing the Holloway Guide to Raising Venture Capital";
var SRC_CA = "Paraphrasing Jason Calacanis, Angel";
var WEEK_IDS = { p1: 1, p2: 1, p5: 1, m1: 1, m4: 1, m5: 1, c1: 1, c4: 1, c2: 1, b4: 1, b3: 1, b1: 1 };

/* The 25 field notes: [id, phase, title, text, source, where else it shows]. */
var GUIDE = [
  ["p1", 0, "Lines, not dots", "Investors trust a trend they watched more than one good meeting. Send a short update before you ask for money, so by the time you ask they’ve seen you improve.", SRC_SU, "the monthly update"],
  ["p2", 0, "Start with people who know you", "People who already know you are the fastest first meetings, and their interest makes the next investors take you seriously.", SRC_PG, "day one"],
  ["p5", 0, "What a SAFE is", "Investors give money now and get shares later, when you raise a priced round. The cap is the highest valuation their money converts at. Post-money makes ownership easy to work out up front.", SRC_VD, "The round"],
  ["p3", 0, "Choosing who", "Check two things first: does this investor lead rounds at your stage, and do they write checks your size? A round needs a lead; followers wait for one.", SRC_VD, "Researched"],
  ["p4", 0, "Not at fit yet", "Pre-seed investors back the team, an insight others missed, and how fast you learn. An honest “not yet, and here’s the evidence” reads as on track.", SRC_PG + ", and Scott Kupor, Secrets of Sand Hill Road", "Story"],
  ["p6", 0, "Asking for an intro", "Make it easy to say yes: ask the connector first if they’re comfortable, then send a short email they can forward without editing.", SRC_HO, "Intro asked"],
  ["p7", 0, "Cold notes", "Cold notes work less often than intros, so they’re the fallback. Keep it short, lead with the most surprising thing you’ve learned, and make one ask.", SRC_HO, "cold notes"],
  ["m1", 1, "Pack first meetings together", "Meet investors in a short burst rather than one at a time. Interest overlaps, investors see others are looking, and the pitch improves fast.", SRC_PG, "Meetings week"],
  ["m2", 1, "When the intro lands", "Reply within a day: thank the connector, move them to bcc, and offer two specific times.", SRC_HO, "Intro made"],
  ["m3", 1, "The first meeting", "Most of a fund’s returns come from a few huge outcomes, so investors listen for how big this could get, not how safe it is.", SRC_SH, "First meeting"],
  ["m4", 1, "Before each meeting", "Know what they’ve backed and how big their checks are. Lead with your strongest evidence, and know which hard question they’ll likely ask.", SRC_VD, "prep sheets"],
  ["m5", 1, "Follow up within a day", "Send what you promised within 24 hours. Speed here reads as how you’ll run the company.", SRC_HO, "Follow-up"],
  ["m6", 1, "Reading interest", "Investors rarely say no outright. Treat it as no until it’s an unambiguous yes, and keep meeting others meanwhile.", SRC_PG, "Meetings"],
  ["m9", 1, "A real next step", "Interest shows in actions with dates: a partner meeting, a request for customer calls. Warm words without a date don’t count yet.", SRC_PG, "Meetings"],
  ["m7", 1, "The partner meeting", "At a fund, the person you met has to win over their partners. Give them what they need to argue for you, in a form they can forward.", SRC_SH, "Partner meeting"],
  ["m8", 1, "When it goes quiet", "Silence after a meeting is common and not a verdict. Send news, not a nudge: what you learned since you last spoke.", SRC_SU, "quiet investors"],
  ["c1", 2, "Momentum", "The first commitment makes the rest easier, because investors take comfort from other investors. Put your effort where a yes is closest.", SRC_PG, "Close week"],
  ["c4", 2, "Set a close date", "Give interested investors a real date for the round. A date turns “maybe later” into a decision.", SRC_VD, "Close week"],
  ["c2", 2, "Diligence at pre-seed", "Early diligence is light: references on the founders and a few customer conversations. Your Discovery calls are those references.", SRC_VD, "Diligence"],
  ["c3", 2, "Reading the terms", "On a SAFE the numbers that matter are the amount and the cap. Have a lawyer read anything beyond the standard form, such as side letters or extra rights.", SRC_VD, "Terms"],
  ["c5", 2, "After they sign", "Thank them, add them to the monthly update, and ask who else they’d introduce you to. Investors often bring the next investor.", SRC_PG, "Signed"],
  ["b1", 3, "After a pass", "A pass now is often a yes next round. Keep them on the monthly update; they’ll have watched you improve.", SRC_SU, "Keep updated"],
  ["b2", 3, "A clear pass is useful", "Write down the bar they named, like “come back with revenue”, and tell them when you clear it.", SRC_SU, "Meetings"],
  ["b3", 3, "A smaller angel round", "Angels decide faster and write smaller checks, and several together can make a round. Useful if funds move slowly.", SRC_CA, "Backup week"],
  ["b4", 3, "The holiday slowdown", "Most investors go quiet from mid-December to early January. Aim to have signatures before then.", "Widely reported by founders; not from one book", "Backup week"],
].map(function (g) {
  return { id: g[0], phase: g[1], title: g[2], text: g[3], src: g[4], where: g[5], week: !!WEEK_IDS[g[0]] };
});

/* The five hard questions, and why each is asked. */
var WHY_THEY_ASK = [
  { id: "pmf", text: "Do you have product-market fit?", why: "They want to see you know the difference between interest and fit. An honest “not yet, here’s the evidence” is the strong answer.", src: SRC_PG },
  { id: "big", text: "How big can this get?", why: "A fund’s returns come from a few very large companies, so each investment has to be able to become one.", src: SRC_SH },
  { id: "pay", text: "Will they pay, or just complain?", why: "Commitment before a product exists is the strongest early signal you can show.", src: SRC_VD },
  { id: "why", text: "Why are you two the ones to build this?", why: "At pre-seed, the team is most of what an investor can judge.", src: SRC_PG },
  { id: "now", text: "Why now?", why: "Timing explains why nobody has solved it yet.", src: SRC_HO },
];

/* Which field note each investor step, draft kind and reading opens. */
var STEP_NOTE = { 0: "p3", 1: "p6", 2: "m2", 3: "m3", 4: "m5", 5: "m7", 6: "c2", 7: "c3", 8: "c5", quiet: "m8", passed: "b1" };
var DRAFT_NOTE = { intro: "p6", cold: "p7", direct: "p2", reply: "m2", followup: "m5", prep: "m4", checkin: "m8", update: "p1" };
var READING_NOTE = { next: "m9", maybe: "m6", pass: "b2", intro: "m3" };

/* ---- dates --------------------------------------------------------------- */

function pad2(n) { return (n < 10 ? "0" : "") + n; }

/* An ISO day in the operator's local time, from a time, a Date or a day. */
function isoDay(t) {
  if (typeof t === "string" && /^\d{4}-\d{2}-\d{2}/.test(t)) return t.slice(0, 10);
  var d = t instanceof Date ? t : new Date(t == null ? Date.now() : t);
  return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate());
}

function dayNum(iso) {
  var p = String(iso).split("-");
  return Date.UTC(+p[0], +p[1] - 1, +p[2]) / DAY;
}

function fromDayNum(n) {
  var d = new Date(n * DAY);
  return d.getUTCFullYear() + "-" + pad2(d.getUTCMonth() + 1) + "-" + pad2(d.getUTCDate());
}

function addDays(iso, n) { return fromDayNum(dayNum(iso) + n); }
function diffDays(a, b) { return Math.round(dayNum(a) - dayNum(b)); }

var MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];

/* "Oct 1" from an ISO day. */
function dayLabel(iso) {
  var p = String(iso).split("-");
  return MONTHS[+p[1] - 1] + " " + (+p[2]);
}

/* "Oct 1–20" inside a month, "Oct 21–Nov 15" across two. */
function rangeLabel(from, to) {
  var a = from.split("-"), b = to.split("-");
  if (a[0] === b[0] && a[1] === b[1]) return dayLabel(from) + "–" + (+b[2]);
  return dayLabel(from) + "–" + dayLabel(to);
}

function validDay(v) { return typeof v === "string" && /^\d{4}-\d{2}-\d{2}$/.test(v) && !isNaN(dayNum(v)); }

/* ---- records ------------------------------------------------------------- */

/* Records out of the store, by kind. read is the map of field-note ids
   the operator has read. */
function records(data) {
  var out = { settings: (data && data.settings) || {}, investors: [], drafts: [], meetings: [], questions: [], read: (data && data.read && typeof data.read === "object") ? data.read : {} };
  for (var k in data || {}) {
    var v = data[k];
    if (!v || typeof v !== "object") continue;
    if (k.indexOf("investor:") === 0) out.investors.push(Object.assign({ id: k.slice(9) }, v));
    else if (k.indexOf("draft:") === 0) out.drafts.push(Object.assign({ id: k.slice(6) }, v));
    else if (k.indexOf("meeting:") === 0) out.meetings.push(Object.assign({ id: k.slice(8) }, v));
    else if (k.indexOf("question:") === 0) out.questions.push(Object.assign({ id: k.slice(9) }, v));
  }
  return out;
}

/* ---- the round and its phases ------------------------------------------- */

function clampDay(n, lo, hi) { return Math.max(lo, Math.min(hi, n)); }

/* The round's dates and the four phases. Start defaults to today, close-by
   to Nov 30 and must-close to Dec 15 of the year it falls in. Prepare runs
   20 days from the start, Meetings to 15 days before close-by, Close to
   close-by, Backup to must-close. Each boundary is clamped so a phase is
   at least a day long and the phases never overlap, even when close-by
   comes early. */
function roundOf(settings, now) {
  var s = (settings && settings.round) || {};
  var today = isoDay(now);
  var start = validDay(s.start) ? s.start : today;
  var year = +start.slice(0, 4);
  var closeBy = validDay(s.closeBy) ? s.closeBy : year + "-11-30";
  var mustClose = validDay(s.mustClose) ? s.mustClose : year + "-12-15";
  if (!validDay(s.closeBy) && closeBy < start) closeBy = (year + 1) + "-11-30";
  if (!validDay(s.mustClose) && mustClose < closeBy) mustClose = closeBy.slice(0, 4) + "-12-15";
  var st = dayNum(start);
  var e3 = Math.max(dayNum(mustClose), st + 3);
  var e2 = clampDay(dayNum(closeBy), st + 2, e3 - 1);
  var e1 = clampDay(dayNum(closeBy) - MEETINGS_BEFORE_CLOSE, st + 1, e2 - 1);
  var e0 = clampDay(st + PREPARE_DAYS - 1, st, e1 - 1);
  var ends = [e0, e1, e2, e3];
  var phases = PHASES.map(function (p, i) {
    return { name: p.name, from: fromDayNum(i === 0 ? st : ends[i - 1] + 1), to: fromDayNum(ends[i]) };
  });
  return { start: start, closeBy: closeBy, mustClose: mustClose, phases: phases };
}

/* Which phase today is in: 0 to 3. Before the start is Prepare, after the
   last day is Backup. */
function phaseAt(round, now) {
  var today = isoDay(now);
  for (var i = 0; i < round.phases.length; i++) {
    if (today <= round.phases[i].to) return i;
  }
  return round.phases.length - 1;
}

/* Whole days since last contact, when the investor has gone quiet: 10 or
   more days with no next step due still ahead. Passed and signed
   investors aren't quiet. Otherwise null. */
function quietDays(inv, now) {
  if (!inv || inv.passed || inv.step === 8 || !validDay(inv.lastContact)) return null;
  var today = isoDay(now);
  var days = diffDays(today, inv.lastContact);
  if (days < QUIET_AFTER) return null;
  if (inv.next && validDay(inv.next.due) && inv.next.due >= today) return null;
  return days;
}

/* ---- hard questions ------------------------------------------------------ */

/* "ready", "needs" or "yours". The founders' own two (why, now) are never
   drafted, so they read "yours" until something is written. A drafted
   answer that is missing, or marked needs, needs evidence. */
function questionStatus(r, id) {
  var q = null;
  for (var i = 0; i < r.questions.length; i++) if (r.questions[i].id === id) q = r.questions[i];
  var written = !!(q && typeof q.answer === "string" && q.answer.trim());
  if (id === "why" || id === "now") return written ? "ready" : "yours";
  if (q && q.status === "ready") return "ready";
  if (q && !q.status && written) return "ready";
  return "needs";
}

var DRAFTED = ["pmf", "big", "pay"];

/* The hard questions that still need evidence: the three drafted ones, and
   any a meeting added that is marked needs. */
function questionsNeeding(r) {
  var ids = DRAFTED.filter(function (id) { return questionStatus(r, id) !== "ready"; });
  r.questions.forEach(function (q) {
    if (DRAFTED.indexOf(q.id) < 0 && q.id !== "why" && q.id !== "now" && q.status === "needs") ids.push(q.id);
  });
  return ids;
}

/* ---- what to do next ----------------------------------------------------- */

function sentAny(r) { return r.drafts.some(function (d) { return d.status === "sent"; }); }

function liveInvestors(r) { return r.investors.filter(function (i) { return !i.passed; }); }

function byDue(a, b) { return a.next.due < b.next.due ? -1 : a.next.due > b.next.due ? 1 : 0; }

/* The two things that can't wait: a follow-up a meeting asked for, then the
   investor step due soonest (today or overdue). Null when neither. */
function urgent(r, live, byId, today) {
  var asks = r.drafts.filter(function (d) { return d.status === "requested"; });
  if (asks.length) {
    var who = byId[asks[0].investor];
    return { zone: "send", text: "Draft the follow-up for " + (who && who.name ? who.name : "your last meeting") + " in 3 · To send. Within a day reads as how you’ll run the company." };
  }
  var due = live.filter(function (i) { return i.next && validDay(i.next.due) && i.next.due <= today; }).sort(byDue);
  if (due.length) return { zone: "investors", text: due[0].name + ": " + due[0].next.text + ". Due " + (due[0].next.due === today ? "today" : "since " + due[0].next.due) + ", in 2 · Investors." };
  return null;
}

/* What the operator does next, as the strip and the zone ring say it.
   zone is one of the kit's zone keys (progress, story, investors, send,
   meetings). cap is the small label over it. During day one, start lists
   the three starting moves. */
function nextFor(r, now) {
  var today = isoDay(now);
  var haveInv = r.investors.length > 0;
  var roundSet = !!(r.settings.round && r.settings.round.set);
  // Fill answers has run once all three records exist, whatever they say:
  // the asker writes "needs" honestly when Discovery lacks the evidence, and
  // that must not keep the operator on day one. Day one ends when a draft is sent.
  var filled = DRAFTED.every(function (id) { return r.questions.some(function (q) { return q.id === id; }); });
  var done = (haveInv ? 1 : 0) + (roundSet ? 1 : 0) + (filled ? 1 : 0);
  var dayOne = !sentAny(r);
  function out(zone, text, cap, start) {
    var o = { zone: zone, text: text, cap: cap || "NEXT FOR YOU" };
    if (start) o.start = start;
    return o;
  }
  var live = liveInvestors(r);
  var byId = {};
  r.investors.forEach(function (i) { byId[i.id] = i; });
  var early = urgent(r, live, byId, today);
  // Once any draft exists, a requested follow-up or a step due comes ahead
  // of the day-one checklist.
  if (early && r.drafts.length) return out(early.zone, early.text);
  if (dayOne) {
    var start = [
      { label: "Add the investors you know", done: haveInv },
      { label: "Set the round", done: roundSet },
      { label: "Fill answers from Discovery", done: filled },
    ];
    var cap = done < 3 ? "START HERE · " + done + " OF 3 DONE" : "NEXT FOR YOU";
    if (!haveInv) return out("investors", "Add the investors you already know in 2 · Investors. Names are enough.", cap, start);
    if (!roundSet) return out("story", "Set the round in 1 · Story: how much, and what it buys.", cap, start);
    if (!filled) return out("story", "Press Fill answers from Discovery in 1 · Story. Your calls already hold the evidence.", cap, start);
    if (!r.drafts.length) return out("investors", "You’re set up. Pick someone you know in 2 · Investors and draft a first note.", cap, start);
    return out("send", "Send your note from 3 · To send, then press Sent. That’s the raise started.", cap, start);
  }
  if (early) return out(early.zone, early.text);
  var needing = questionsNeeding(r);
  if (needing.length) {
    var drafted = needing.filter(function (id) { return DRAFTED.indexOf(id) >= 0; });
    if (drafted.length) {
      return out("story", (drafted.length === 1 ? "A hard question still needs" : drafted.length + " hard questions still need") + " evidence. Press Fill answers from Discovery in 1 · Story.");
    }
    var q = r.questions.filter(function (x) { return x.id === needing[0]; })[0];
    var qt = (q && typeof q.text === "string" && q.text.trim()) || needing[0];
    return out("story", "Write an answer to “" + qt + "” in 1 · Story.");
  }
  var soon = live.filter(function (i) { return i.next && validDay(i.next.due); }).sort(byDue);
  if (soon.length) return out("investors", soon[0].name + ": " + soon[0].next.text + ". Due " + soon[0].next.due + ", in 2 · Investors.");
  return out("investors", "Pick an investor in 2 · Investors and set their next step.");
}

/* The quietest investor, as one line for under Next for you, or null. */
function alsoWaiting(r, now) {
  var best = null, days = 0;
  r.investors.forEach(function (i) {
    var q = quietDays(i, now);
    if (q != null && q > days) { best = i; days = q; }
  });
  return best ? best.name + " has been quiet " + days + " days" : null;
}

/* ---- field notes --------------------------------------------------------- */

/* The three This week notes for a phase. */
function weekNotes(phase) {
  return GUIDE.filter(function (g) { return g.phase === phase && g.week; });
}

/* How many of a phase's This week notes are still unread. */
function unreadWeek(r, phase) {
  return weekNotes(phase).filter(function (g) { return !r.read[g.id]; }).length;
}

/* ---- Discovery ----------------------------------------------------------- */

function commitmentLive(c, now) {
  if (!c) return false;
  var s = c.status;
  if (s === "lapsed" || s === "broken" || s === "declined" || s === "withdrawn") return false;
  if (s === "fulfilled" || s === "kept") return true;
  var due = Date.parse(c.due);
  if (isNaN(due) || !isFinite(now)) return true;
  return due + 14 * DAY >= now;
}

/* What the Story page says about Discovery, from a Discovery store, by
   Discovery's own rule: a call counts when it has a person, is in the
   segment, isn't tainted by a pitch, isn't with a friend or family member
   and isn't a low-confidence call where the speaker is unclear; each
   person counts once, by their latest counted call. Then: how many
   scored 4 or 5 (hair on fire), people holding a live commitment, the
   strongest quote with who said it, and how many times the bets were
   sharpened. any is false until there is a call. */
function discoveryEligible(c, who) {
  if (!c || typeof c !== "object" || !c.person) return false;
  var p = who[c.person];
  if (c.inSegment === false) return false;
  if (c.tainted) return false;
  if (p && p.relationship === "friend-family") return false;
  if (c.confidence === "low" && (c.speakerAmbiguous === true || c.speaker === "ambiguous")) return false;
  return true;
}

function discoveryTime(c) {
  var t = c.date != null && c.date !== "" ? Date.parse(c.date) : NaN;
  if (isNaN(t) && c.at != null && c.at !== "") t = typeof c.at === "number" ? c.at : Date.parse(c.at);
  return isNaN(t) ? 0 : t;
}

function fromDiscovery(data, now) {
  var sharpened = 0, best = null, who = {};
  var committed = {}, latest = {};
  var ms = typeof now === "number" ? now : Date.parse(now);
  for (var k in data || {}) {
    var v = data[k];
    if (!v || typeof v !== "object") continue;
    if (k.indexOf("person:") === 0) who[v.id || k.slice(7)] = v;
    else if (k.indexOf("market:") === 0) {
      var bv = v.bet && Number(v.bet.v);
      if (isFinite(bv) && bv > 1) sharpened += bv - 1;
    }
  }
  for (var k2 in data || {}) {
    if (k2.indexOf("call:") !== 0) continue;
    var c = data[k2];
    if (!discoveryEligible(c, who)) continue;
    var prev = latest[c.person];
    if (!prev || discoveryTime(c) >= discoveryTime(prev)) latest[c.person] = c;
    var lv = Number(c.level) || 0;
    if (c.commitment && commitmentLive(c.commitment, ms)) committed[c.person] = true;
    if (typeof c.quote === "string" && c.quote.trim() && (!best || lv > best.lv)) best = { lv: lv, text: c.quote.trim(), person: c.person };
  }
  var calls = 0, hot = 0;
  for (var pid in latest) {
    calls++;
    if ((Number(latest[pid].level) || 0) >= 4) hot++;
  }
  var quote = null;
  if (best) {
    var p = who[best.person];
    quote = { text: best.text, who: (p && p.name) || "" };
  }
  return { calls: calls, hot: hot, commits: Object.keys(committed).length, quote: quote, sharpened: sharpened, any: calls > 0 };
}

/* ---- readings ------------------------------------------------------------ */

/* An investor after a meeting read as next, maybe, pass or intro. Returns
   a new record; the input isn't changed. next is idempotent for a first
   meeting, like pressing Met on a prep sheet: below Follow-up (4) it moves
   them to 4, and at 4 it leaves them there when Met already put them there
   on or after the meeting's day; otherwise it moves them one step on.
   intro books the first meeting, maybe leaves the step, pass marks them
   passed. */
function applyReading(inv, reading, at) {
  var o = Object.assign({}, inv);
  var step = typeof o.step === "number" ? o.step : 0;
  var before = step;
  o.dates = Object.assign({}, o.dates);
  o.lastContact = at;
  if (reading === "next") {
    if (step < 4) step = 4;
    else if (step === 4 && typeof o.dates[4] === "string" && o.dates[4] >= at) step = 4;
    else step = Math.min(8, step + 1);
  }
  else if (reading === "intro") step = Math.max(step, 3);
  else if (reading === "pass") { o.passed = true; o.passedAt = at; }
  if (step !== before) o.dates[step] = at;
  o.step = step;
  return o;
}

/* An investor moved on exactly one step by hand or by a sent draft, the
   old next step (which belonged to the step they left) dropped so nothing
   stale is shown as due. */
function advanceStep(inv, at) {
  var o = Object.assign({}, inv);
  var step = typeof o.step === "number" ? o.step : 0;
  var to = Math.min(8, step + 1);
  o.dates = Object.assign({}, o.dates);
  o.lastContact = at;
  if (to !== step) o.dates[to] = at;
  o.step = to;
  delete o.next;
  return o;
}

/* What pressing Met on a prep sheet does to an investor: last contact is
   today and they move to Follow-up (4) if below it, never backwards. The
   old next step is dropped. */
function metInvestor(inv, at) {
  var o = Object.assign({}, inv, { lastContact: at });
  var step = typeof o.step === "number" ? o.step : 0;
  if (step < 4) { o.step = 4; o.dates = Object.assign({}, inv.dates); o.dates[4] = at; }
  delete o.next;
  return o;
}

/* A field note by id, or undefined. */
function noteById(id) {
  for (var i = 0; i < GUIDE.length; i++) if (GUIDE[i].id === id) return GUIDE[i];
  return undefined;
}

/* "3 calls", "1 call". */
function plural(n, one, many) { return n + " " + (n === 1 ? one : many || one + "s"); }

/* An investor's step as a whole number 0 to 8; 0 when missing. */
function stepOf(inv) { var s = inv && inv.step; return typeof s === "number" && s >= 0 && s <= 8 ? Math.floor(s) : 0; }

/* A phase to read ahead on, or null: only a whole number from 0 to 3. */
function peekOf(settings) {
  var p = settings && settings.peek;
  return typeof p === "number" && p >= 0 && p <= 3 && Math.floor(p) === p ? p : null;
}

/* Where a card goes. The app writes each kit page a map of the kit's zone
   keys to the zones it placed ("kitZones"), so a renamed zone, or a second
   placing, still lands here. Without it the zone's key stands. */
function zoneFor(zones, key) {
  var id = zones && typeof zones === "object" ? zones[key] : "";
  return typeof id === "string" && id ? id : key;
}

/* What each kind of draft is called, in To send's chips and in the title of
   the card that asks for it. The asker picks the draft from that title. */
var DRAFT_LABEL = { intro: "Intro request", cold: "Cold note", direct: "Note", reply: "Reply", followup: "Follow-up", prep: "Prep sheet", checkin: "Check-in", update: "Monthly update" };
</script>

<script id="logic">
/* THE STRIP'S RULES. Pure functions, no DOM, no window: pages.test.mjs
   pulls this block out of the page, after core, and runs it under node. */

/* The weeks left to the must-close date, in whole weeks, then days. */
function weeksLine(round, now) {
  var left = diffDays(round.mustClose, isoDay(now));
  var to = dayLabel(round.mustClose);
  if (left < 0) return "Past " + to;
  if (left < 7) return left + (left === 1 ? " day" : " days") + " to " + to;
  var w = Math.floor(left / 7);
  return w + (w === 1 ? " week" : " weeks") + " to " + to;
}

/* Everything the strip draws. discovery is a Discovery store's data, or
   undefined; the strip doesn't draw it yet, but the call keeps the same
   shape as the other pages. */
function view(data, discovery, now) {
  var r = records(data);
  var round = roundOf(r.settings, now);
  var cur = phaseAt(round, now);
  var peek = peekOf(r.settings);
  var next = nextFor(r, now);
  var phases = round.phases.map(function (p, i) {
    var fresh = i === cur ? unreadWeek(r, i) : 0;
    return {
      index: i,
      name: p.name,
      dates: rangeLabel(p.from, p.to),
      why: PHASES[i].why,
      state: i < cur ? "done" : i === cur ? "now" : "later",
      mark: i < cur ? "✓" : String(i + 1),
      peeking: peek === i && i !== cur,
      newLine: fresh ? "New this week: " + fresh + " field note" + (fresh === 1 ? "" : "s") + " →" : "",
    };
  });
  return {
    today: "Today · " + dayLabel(isoDay(now)),
    weeksLeft: weeksLine(round, now),
    phases: phases,
    next: next,
    also: alsoWaiting(r, now),
    start: next.start || null,
    round: round,
    needsStart: !(r.settings.round && validDay(r.settings.round.start)),
  };
}

/* Settings after a click on phase i: today's phase, or the one already
   being read ahead on, clears the peek; any other becomes the peek. */
function peekPatch(settings, i, now) {
  var round = roundOf(settings, now);
  var cur = phaseAt(round, now);
  var peek = peekOf(settings);
  return Object.assign({}, settings, { peek: i === cur || peek === i ? null : i });
}

/* Settings after a click on the New this week line: back to today's phase
   and open the first unread note for it. */
function openNotePatch(data, now) {
  var r = records(data);
  var round = roundOf(r.settings, now);
  var cur = phaseAt(round, now);
  var first = weekNotes(cur).filter(function (g) { return !r.read[g.id]; })[0];
  return Object.assign({}, r.settings, { peek: null, openNote: first ? first.id : null });
}

/* Settings with the start day kept, the first time the strip runs. */
function withStart(settings, now) {
  var round = Object.assign({}, settings.round);
  round.start = roundOf(settings, now).start;
  return Object.assign({}, settings, { round: round });
}

/* Ring a zone only when the next step moves to a different one. */
function shouldMark(prevZone, zone) {
  return !!zone && zone !== prevZone;
}
</script>

<script>
(function () {
  var app = document.getElementById("app");
  var kit = window.wibble && window.wibble.kit;
  var lastZone = null;
  var data = {};
  var started = false;

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function settings() { return (data && data.settings) || {}; }

  function render() {
    var discovery;
    try {
      var d = window.wibble && window.wibble.read && window.wibble.read("discovery-kit");
      discovery = d && d.all ? d.all() : undefined;
    } catch (_) {}
    var now = Date.now();
    var s = view(data, discovery, now);
    var phases = s.phases.map(function (p) {
      return '<div class="fr-phase fr-' + p.state + (p.peeking ? " fr-peeking" : "") + '">' +
        '<button class="fr-pick" type="button" data-phase="' + p.index + '" aria-pressed="' + p.peeking + '">' +
        '<span class="fr-phase-h"><span class="fr-dot">' + esc(p.mark) + "</span>" + esc(p.name) + '<span class="fr-dates">' + esc(p.dates) + "</span></span>" +
        '<span class="fr-why">' + esc(p.why) + "</span></button>" +
        (p.newLine ? '<button class="fr-new" type="button" data-new="1">' + esc(p.newLine) + "</button>" : "") + "</div>";
    }).join("");
    var n = s.next;
    var start = s.start ? '<div class="fr-start">' + s.start.map(function (k) {
      return '<div class="fr-step' + (k.done ? " fr-ok" : "") + '"><span class="fr-dot">' + (k.done ? "✓" : "") + "</span>" + esc(k.label) + "</div>";
    }).join("") + "</div>" : "";
    app.innerHTML =
      '<div class="fr-round"><div class="fr-cap">THE ROUND</div><div class="fr-today">' + esc(s.today) + '</div><div class="fr-weeks">' + esc(s.weeksLeft) + "</div></div>" +
      '<div class="fr-phases">' + phases + "</div>" +
      '<div class="fr-next"><div class="fr-cap">' + esc(n.cap) + '</div><div class="fr-line">' + esc(n.text) + "</div>" + start +
      (s.also ? '<div class="fr-also">Also waiting: ' + esc(s.also) + "</div>" : "") + "</div>";
    if (!started && s.needsStart && typeof kit.set === "function") {
      started = true;
      try { kit.set("settings", withStart(settings(), now)); } catch (_) {}
    }
    if (shouldMark(lastZone, n.zone)) {
      lastZone = n.zone;
      try {
        if (window.wibble && window.wibble.mark) Promise.resolve(window.wibble.mark(n.zone, { text: "Next for you" })).catch(function () {});
      } catch (_) {}
    }
  }

  if (!kit) {
    app.innerHTML = '<p class="fr-empty">Place this kit from the zone menu.</p>';
    return;
  }
  app.addEventListener("click", function (e) {
    var t = e.target.closest && e.target.closest("button");
    if (!t) return;
    if (t.hasAttribute("data-new")) kit.set("settings", openNotePatch(data, Date.now()));
    else if (t.hasAttribute("data-phase")) kit.set("settings", peekPatch(settings(), +t.getAttribute("data-phase"), Date.now()));
  });
  kit.subscribe(function (d) { data = d || {}; render(); });
})();
</script>
</body>
</html>
